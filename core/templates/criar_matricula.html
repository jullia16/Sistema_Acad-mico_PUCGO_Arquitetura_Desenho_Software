<!DOCTYPE html>
<html>
<head>
    <title>Nova Matrícula</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="container mt-4">

    <h1 class="mb-4">Nova Matrícula</h1>

    <form method="POST">

        {% csrf_token %}

        <div class="mb-3">

            <label class="form-label">
                Aluno:
            </label>

            <select name="aluno" class="form-select">

                {% for aluno in alunos %}

                <option value="{{ aluno.id }}">
                    {{ aluno.nome }}
                </option>

                {% endfor %}

            </select>

        </div>


        <div class="mb-3">

            <label class="form-label">
                Turma:
            </label>

            <select name="turma" class="form-select">

                {% for turma in turmas %}

                <option value="{{ turma.id }}">
                    {{ turma.disciplina.nome }}
                    - {{ turma.semestre }}
                </option>

                {% endfor %}

            </select>

        </div>


        <button type="submit" class="btn btn-primary">
            Matricular
        </button>

    </form>

    <hr>

    <a class="btn btn-dark btn-sm" href="/">
        Voltar
    </a>

</body>
</html>
