<!DOCTYPE html>
<html>
<head>
    <title>Matrículas</title>
    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    >
</head>
<body class="container mt-4">
    <h1>Matrículas</h1>
    
    <h2>Nova Matrícula</h2>
    <form method="POST">
        {% csrf_token %}
        
        <label>Aluno:</label>
        <select name="aluno">
            {% for aluno in alunos %}
            <option value="{{ aluno.id }}">
                {{ aluno.nome }}
            </option>
            {% endfor %}
        </select>
        <br><br>
        
        <label>Turma:</label>
        <select name="turma">
            {% for turma in turmas %}
            <option value="{{ turma.id }}">
                {{ turma.disciplina.nome }} - {{ turma.semestre }}
            </option>
            {% endfor %}
        </select>
        <br><br>
        
        <button class="btn btn-primary btn-sm" type="submit">Matricular</button>
    </form>
    
    <hr>
    
    <h2>Lista de Matrículas</h2>
    <ul>
        {% for matricula in matriculas %}
        <li>
            {{ matricula.aluno.nome }} - {{ matricula.turma.disciplina.nome }} - {{ matricula.turma.semestre }}
            <a class="btn btn-warning btn-sm" href="/editar-matricula/{{ matricula.id }}/">Editar</a>
            <a class="btn btn-secondary btn-sm" href="/cancelar-matricula/{{ matricula.id }}/">Cancelar</a>
            <a class="btn btn-danger btn-sm" href="/excluir-matricula/{{ matricula.id }}/">Excluir</a>
        </li>
        {% endfor %}
    </ul>
    
    <br>
    <a class="btn btn-dark btn-sm" href="/">Voltar</a>
</body>
</html>
