<!DOCTYPE html>
<html>
<head>
    <title>Alunos</title>
    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    >
</head>
<body class="container mt-4">
    <h1>Alunos</h1>
    
    <h2>Novo Aluno</h2>
    <form method="POST">
        {% csrf_token %}
        
        <label>Nome:</label>
        <input type="text" name="nome" required>
        <br><br>
        
        <label>Matrícula:</label>
        <input type="text" name="matricula" required>
        <br><br>
        
        <button type="submit" class="btn btn-primary">Salvar</button>
    </form>
    
    <hr>
    
    <h2>Lista de Alunos</h2>
    <ul>
        {% for aluno in alunos %}
        <li>
            {{ aluno.nome }} - {{ aluno.matricula }}
            <a class="btn btn-warning btn-sm" href="/editar-aluno/{{ aluno.id }}/">Editar</a>
            <a class="btn btn-danger btn-sm" href="/excluir-aluno/{{ aluno.id }}/">Excluir</a>
        </li>
        {% endfor %}
    </ul>
    
    <br>
    <a class="btn btn-dark btn-sm" href="/">Voltar</a>
</body>
</html>
