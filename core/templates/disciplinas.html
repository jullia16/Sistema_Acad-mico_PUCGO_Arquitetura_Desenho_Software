<!DOCTYPE html>
<html>
<head>
    <title>Disciplinas</title>
    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    >
</head>
<body class="container mt-4">
    <h1>Disciplinas</h1>
    
    <h2>Nova Disciplina</h2>
    <form method="POST">
        {% csrf_token %}
        
        <label>Nome:</label>
        <input type="text" name="nome" required>
        <br><br>
        
        <label>Código:</label>
        <input type="text" name="codigo" required>
        <br><br>
        
        <label>Carga Horária:</label>
        <input type="number" name="carga_horaria" required>
        <br><br>
        
        <button type="submit" class="btn btn-primary">Salvar</button>
    </form>
    
    <hr>
    
    <h2>Lista de Disciplinas</h2>
    <ul>
        {% for disciplina in disciplinas %}
        <li>
            {{ disciplina.nome }} - {{ disciplina.codigo }}
            <a class="btn btn-warning btn-sm" href="/editar-disciplina/{{ disciplina.id }}/">Editar</a>
            <a class="btn btn-danger btn-sm" href="/excluir-disciplina/{{ disciplina.id }}/">Excluir</a>
        </li>
        {% endfor %}
    </ul>
    
    <br>
    <a class="btn btn-dark btn-sm" href="/">Voltar</a>
</body>
</html>
