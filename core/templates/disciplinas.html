<!DOCTYPE html>
<html>
<head>
    <title>Disciplinas</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="container mt-4">

    <h1 class="mb-4">Disciplinas</h1>

    <h2 class="mb-3">Nova Disciplina</h2>

    <form method="POST">

        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">
                Nome:
            </label>

            <input
                type="text"
                name="nome"
                class="form-control"
                required>
        </div>


        <div class="mb-3">

            <label class="form-label">
                Código:
            </label>

            <input
                type="text"
                name="codigo"
                class="form-control"
                required>

        </div>


        <div class="mb-3">

            <label class="form-label">
                Carga Horária:
            </label>

            <input
                type="number"
                name="carga_horaria"
                class="form-control"
                required>

        </div>


        <button
            type="submit"
            class="btn btn-primary">
            Salvar
        </button>

    </form>

    <hr class="my-4">


    <h2 class="mb-3">
        Lista de Disciplinas
    </h2>

    <ul class="list-group">

        {% for disciplina in disciplinas %}

        <li class="list-group-item d-flex justify-content-between align-items-center">

            <span>
                {{ disciplina.nome }}
                -
                {{ disciplina.codigo }}
            </span>

            <div>

                <a
                    class="btn btn-warning btn-sm"
                    href="/editar-disciplina/{{ disciplina.id }}/">

                    Editar

                </a>

                <a
                    class="btn btn-danger btn-sm"
                    href="/excluir-disciplina/{{ disciplina.id }}/">

                    Excluir

                </a>

            </div>

        </li>

        {% endfor %}

    </ul>


    <div class="mt-4">
        <a class="btn btn-dark btn-sm" href="/">
            Voltar
        </a>
    </div>

</body>
</html>
