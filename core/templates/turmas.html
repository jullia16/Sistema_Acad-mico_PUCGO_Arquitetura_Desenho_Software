<!DOCTYPE html>
<html>
<head>
    <title>Turmas</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="container mt-4">

    <h1 class="mb-4">Turmas</h1>
    <h2 class="mb-3">Nova Turma</h2>
    
    <form method="POST">

        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Disciplina:</label>
            <select name="disciplina" class="form-select">
                {% for disciplina in disciplinas %}

                <option value="{{ disciplina.id }}">
                    {{ disciplina.nome }}
                </option>

                {% endfor %}
            </select>
        </div>


        <div class="mb-3">
            <label class="form-label">Semestre:</label>
            <input type="text" name="semestre" class="form-control" required>
        </div>


        <div class="mb-3">
            <label class="form-label">Vagas:</label>
            <input type="number" name="vagas" class="form-control" required>
        </div>


        <button type="submit" class="btn btn-primary">Salvar</button>

    </form>

    <hr class="my-4">

    <h2 class="mb-3">Lista de Turmas</h2>

    <ul class="list-group">

        {% for turma in turmas %}

        <li class="list-group-item d-flex justify-content-between align-items-center">
            <span>
                {{ turma.disciplina.nome }}
                -
                {{ turma.semestre }}
            </span>

            <div>
                <a class="btn btn-warning btn-sm" href="/editar-turma/{{ turma.id }}/">Editar</a>
                <a class="btn btn-danger btn-sm" href="/excluir-turma/{{ turma.id }}/">Excluir</a>
            </div>
        </li>

        {% endfor %}

    </ul>

    <div class="mt-4">
        <a class="btn btn-dark btn-sm" href="/">Voltar</a>
    </div>

</body>
</html>
