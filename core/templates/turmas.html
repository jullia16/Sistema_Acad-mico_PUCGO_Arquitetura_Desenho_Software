<!DOCTYPE html>
<html>
<head>
    <title>Turmas</title>
    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    >
</head>
<body class="container mt-4">
    <h1>Turmas</h1>
    
    <h2>Nova Turma</h2>
    <form method="POST">
        {% csrf_token %}
        
        <label>Disciplina:</label>
        <select name="disciplina">
            {% for disciplina in disciplinas %}
            <option value="{{ disciplina.id }}">
                {{ disciplina.nome }}
            </option>
            {% endfor %}
        </select>
        <br><br>
        
        <label>Semestre:</label>
        <input type="text" name="semestre" required>
        <br><br>
        
        <label>Vagas:</label>
        <input type="number" name="vagas" required>
        <br><br>
        
        <button type="submit" class="btn btn-primary">Salvar</button>
    </form>
    
    <hr>
    
    <h2>Lista de Turmas</h2>
    <ul>
        {% for turma in turmas %}
        <li>
            {{ turma.disciplina.nome }} - {{ turma.semestre }}
            <a class="btn btn-warning btn-sm" href="/editar-turma/{{ turma.id }}/">Editar</a>
            <a class="btn btn-danger btn-sm" href="/excluir-turma/{{ turma.id }}/">Excluir</a>
        </li>
        {% endfor %}
    </ul>
    
    <br>
    <a class="btn btn-dark btn-sm" href="/">Voltar</a>
</body>
</html>
