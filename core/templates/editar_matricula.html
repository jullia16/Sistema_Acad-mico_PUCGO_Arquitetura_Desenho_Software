<!DOCTYPE html>
<html>
<head>
    <title>Editar Matrícula</title>
    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    >
</head>
<body class="container mt-4">
    <h1>Editar Matrícula</h1>
    
    <form method="POST">
        {% csrf_token %}
        
        <label>Aluno:</label>
        <select name="aluno">
            {% for aluno in alunos %}
            <option value="{{ aluno.id }}" {% if aluno.id == matricula.aluno.id %}selected{% endif %}>
                {{ aluno.nome }}
            </option>
            {% endfor %}
        </select>
        <br><br>
        
        <label>Turma:</label>
        <select name="turma">
            {% for turma in turmas %}
            <option value="{{ turma.id }}" {% if turma.id == matricula.turma.id %}selected{% endif %}>
                {{ turma.disciplina.nome }} - {{ turma.semestre }}
            </option>
            {% endfor %}
        </select>
        <br><br>
        
        <button type="submit" class="btn btn-primary">Atualizar</button>
    </form>
    
    <br>
    <a class="btn btn-dark btn-sm" href="/matriculas/">Voltar</a>
</body>
</html>
