<!DOCTYPE html>
<html>

<head>
    <title>Editar Matrícula</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="container mt-4">

    <h1 class="mb-4">Editar Matrícula</h1>

    <form method="POST">
        {% csrf_token %}

        <div class="mb-3">

            <label class="form-label">Aluno:</label>

            <select
                name="aluno"
                class="form-select">

                {% for aluno in alunos %}

                <option
                    value="{{ aluno.id }}"
                    {% if aluno.id == matricula.aluno.id %}
                    selected
                    {% endif %}>

                    {{ aluno.nome }}
                </option>

                {% endfor %}
            </select>
        </div>


        <div class="mb-3">

            <label class="form-label">Turma:</label>

            <select name="turma" class="form-select">

                {% for turma in turmas %}

                <option
                    value="{{ turma.id }}"
                    {% if turma.id == matricula.turma.id %}
                    selected
                    {% endif %}>

                    {{ turma.disciplina.nome }}
                    -
                    {{ turma.semestre }}

                </option>

                {% endfor %}
            </select>
        </div>

        <button type="submit" class="btn btn-primary">Atualizar</button>
    </form>


    <div class="mt-4">
        <a class="btn btn-dark btn-sm" href="/matriculas/">Voltar</a>
    </div>

</body>
</html>
