<!DOCTYPE html>
<html>
<head>
    <title>Editar Turma</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="container mt-4">

    <h1>Editar Turma</h1>

    <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Disciplina:</label>

            <select name="disciplina" class="form-select">
                {% for disciplina in disciplinas %}
                <option value="{{ disciplina.id }}"
                    {% if disciplina.id == turma.disciplina.id %}selected{% endif %}>
                    {{ disciplina.nome }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Semestre:</label>

            <input
                type="text"
                name="semestre"
                value="{{ turma.semestre }}"
                class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Vagas:</label>

            <input
                type="number"
                name="vagas"
                value="{{ turma.vagas }}"
                class="form-control">
        </div>

        <button type="submit" class="btn btn-primary btn-sm">
            Atualizar
        </button>
    </form>

    <br>

    <a class="btn btn-dark btn-sm" href="/turmas/">
        Voltar
    </a>

</body>
</html>
