<!DOCTYPE html>
<html>
<head>
    <title>Editar Disciplina</title>
    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    >
</head class="container mt-4">
<body>
    <h1>Editar Disciplina</h1>
    
    <form method="POST">
        {% csrf_token %}
        
        <label>Nome:</label>
        <input type="text" name="nome" value="{{ disciplina.nome }}">
        <br><br>
        
        <label>Código:</label>
        <input type="text" name="codigo" value="{{ disciplina.codigo }}">
        <br><br>
        
        <label>Carga Horária:</label>
        <input type="number" name="carga_horaria" value="{{ disciplina.carga_horaria }}">
        <br><br>
        
        <button type="submit" class="btn btn-primary">Atualizar</button>
    </form>
    
    <br>
    <a class="btn btn-dark btn-sm" href="/disciplinas/">Voltar</a>
</body>
</html>
