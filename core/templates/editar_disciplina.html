<!DOCTYPE html>
<html>

<head>
    <title>Editar Disciplina</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="container mt-4">

    <h1 class="mb-4">Editar Disciplina</h1>

    <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Nome:</label>

            <input type="text" name="nome" value="{{ disciplina.nome }}" class="form-control">

        </div>


        <div class="mb-3">

            <label class="form-label">
                Código:
            </label>

            <input type="text" name="codigo" value="{{ disciplina.codigo }}" class="form-control">
        </div>


        <div class="mb-3">
            <label class="form-label">
                Carga Horária:
            </label>
            <input
                type="number"
                name="carga_horaria"
                value="{{ disciplina.carga_horaria }}"
                class="form-control">
        </div>


        <button type="submit" class="btn btn-primary">Atualizar</button>
    </form>


    <div class="mt-4">
        <a class="btn btn-dark btn-sm" href="/disciplinas/"> Voltar </a>
    </div>

</body>

</html>
